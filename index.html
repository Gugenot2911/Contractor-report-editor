<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчёт по работам</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="left-section">
            <h1>Отчёт по работам</h1>
            <div class="file-upload-section">
                <h2>Загрузка отчета</h2>
                <div class="upload-controls">
                    <input type="file" id="file-input" accept=".xlsx,.xls" style="display: none;">
                    <button onclick="document.getElementById('file-input').click()">Выбрать файл</button>
                    <button id="upload-btn" disabled>Загрузить и обработать</button>
                </div>
                <p id="upload-status">Файл не выбран</p>
            </div>
            <div class="storage-controls">
                <div class="input-group">
                    <input type="text" id="storage-input" placeholder="Введите код склада (например, KZ03)">
                    <button id="load-storage" disabled>Загрузить со склада</button>
                </div>
                <div id="storage-hint" class="hint">Введите код склада для загрузки оборудования</div>
            </div>
            <table id="report-table">
                <thead>
                    <tr>
                        <th>№ Объекта</th>
                        <th>Описание работ</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Данные будут загружены через JS -->
                </tbody>
            </table>
        </div>

        <div class="right-section">
            <h1>Результаты операций</h1>
            <div class="results-container">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>№ Объекта</th>
                            <th>Тип операции</th>
                            <th>№ ОС/Партии</th>
                            <th>CПП-элемент</th>
                            <th>Наименование</th>
                            <th>Кол-во</th>
                            <th>Склад</th>
                            <th>Комментарий</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                        <!-- Данные будут добавляться через JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Шаблоны для динамического содержимого -->
    <template id="row-template">
        <tr data-id="">
            <td class="object-number"></td>
            <td class="work-description"></td>
            <td><button class="toggle-btn" data-id="">▼</button></td>
        </tr>
        <tr class="details-row" data-parent="" style="display: none;">
            <td colspan="3">
                <div class="details-content"></div>
            </td>
        </tr>
    </template>

    <template id="equipment-form-template">
        <form class="work-form" data-id="">
            <div class="form-section">
                <div class="form-group demontage-group">
                    <h3>Демонтаж</h3>

                    <div class="selected-items-container" id="demontage-items-container"></div>

                    <div class="selection-form">
                        <select class="equipment-select demontage-select">
                            <option value="">-- Выберите оборудование --</option>
                        </select>
                        <div class="additional-fields">
                            <input type="text" class="text-field" placeholder="Код склада (4 символа)" maxlength="4" pattern=".{4}" title="Ровно 4 символа">
                            <input type="number" class="quantity-field" placeholder="Кол-во" min="1" value="1">
                            <input type="text" class="comment-field" placeholder="Комментарий (необязательно)">
                            <button type="button" class="add-item-btn">Добавить</button>
                        </div>
                    </div>
                </div>

                <div class="form-group montage-group">
                    <h3>Монтаж</h3>

                    <div class="selected-items-container" id="montage-items-container"></div>

                    <div class="selection-form">
                        <select class="equipment-select montage-select">
                            <option value="">-- Выберите оборудование --</option>
                        </select>
                        <div class="additional-fields">
                            <input type="text" class="text-field" placeholder="Код склада (4 символа)" maxlength="4" pattern=".{4}" title="Ровно 4 символа">
                            <input type="number" class="quantity-field" placeholder="Кол-во" min="1" value="1">
                            <input type="text" class="comment-field" placeholder="Комментарий (необязательно)">
                            <button type="button" class="add-item-btn">Добавить</button>
                        </div>
                    </div>
                </div>
            </div>
            <button type="submit" class="save-btn">Сохранить</button>
        </form>
    </template>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
